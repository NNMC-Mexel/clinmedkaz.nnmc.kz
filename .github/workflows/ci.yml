name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Use the deployment npm version
        run: npm install --global npm@10.9.3
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Server unit and API E2E tests
        run: npm test --prefix server
      - name: Client production build
        run: npm run build --prefix client
      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=critical --prefix server
          npm audit --omit=dev --audit-level=high --prefix client
