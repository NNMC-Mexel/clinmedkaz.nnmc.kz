<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ClinMedKaz article publication payment." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ClinMedKaz Pay</title>
    <!-- Preloader styles live here (not in styles.css) so they apply before the JS bundle loads; React's PageLoader reuses the same markup. -->
    <style>
      .app-loader {
        align-items: center;
        background: linear-gradient(180deg, #ffffff 0, #f5f8fc 320px, #f3f6fa 100%);
        color: #131a2b;
        display: flex;
        flex-direction: column;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        gap: 18px;
        inset: 0;
        justify-content: center;
        padding: 24px 16px;
        position: fixed;
        z-index: 50;
      }
      .app-loader-mark {
        display: grid;
        height: 76px;
        place-items: center;
        position: relative;
        width: 76px;
      }
      .app-loader-ring {
        animation: app-loader-spin 1.1s linear infinite;
        background: conic-gradient(from 0deg, rgba(8, 127, 104, 0) 0deg, #087f68 200deg, #29a4a0 290deg, #2b7fff 360deg);
        border-radius: 50%;
        inset: 0;
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        position: absolute;
      }
      .app-loader-logo {
        align-items: center;
        animation: app-loader-pulse 1.6s ease-in-out infinite;
        background: #131a2b;
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(19, 26, 43, 0.18);
        color: #fff;
        display: inline-flex;
        font-size: 17px;
        font-weight: 800;
        height: 48px;
        justify-content: center;
        letter-spacing: 0.02em;
        width: 48px;
      }
      .app-loader-brand {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin: 4px 0 0;
      }
      .app-loader-brand span {
        color: #087f68;
      }
      .app-loader-bar {
        background: #e3e9f2;
        border-radius: 999px;
        height: 4px;
        overflow: hidden;
        position: relative;
        width: 180px;
      }
      .app-loader-bar span {
        animation: app-loader-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        background: linear-gradient(90deg, #087f68, #29a4a0, #2b7fff);
        border-radius: inherit;
        inset: 0 auto 0 0;
        position: absolute;
        width: 40%;
      }
      .app-loader-text {
        color: #5f6c83;
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        min-height: 21px;
      }
      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes app-loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.92); }
      }
      @keyframes app-loader-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-ring,
        .app-loader-logo,
        .app-loader-bar span {
          animation: none;
        }
        .app-loader-bar span {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loader" role="status" aria-live="polite">
        <div class="app-loader-mark" aria-hidden="true"><span class="app-loader-ring"></span><span class="app-loader-logo">CM</span></div>
        <p class="app-loader-brand">ClinMedKaz <span>Pay</span></p>
        <div class="app-loader-bar" aria-hidden="true"><span></span></div>
        <p class="app-loader-text"></p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
